services:
  searxng:
    image: searxng/searxng:latest
    container_name: leadforge-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    volumes:
      - ./backend/searxng:/etc/searxng:rw
networks:
  default:
    name: leadforge